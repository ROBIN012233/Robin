<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' data:; connect-src 'self'; media-src 'self' file:; worker-src 'self' blob:; frame-src http: https:; child-src http: https:; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen English</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/light.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/modules.css">
</head>
<body data-tier="high" data-effects="on">
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-translate" viewBox="0 0 24 24"><path d="M4 5h7M7.5 5v2.2c0 3-1.4 5.6-4 7.3M5 9c.9 2.3 2.7 4.1 5 5M13 19l3.4-8h1.2L21 19M14.4 16h5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-exam" viewBox="0 0 24 24"><path d="M5 4h9l5 5v11H5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 4v5h5M8 13h7M8 16.5h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-reading" viewBox="0 0 24 24"><path d="M3.5 5.5c3-.8 5.8-.4 8.5 1.3 2.7-1.7 5.5-2.1 8.5-1.3v13c-3-.8-5.8-.4-8.5 1.3-2.7-1.7-5.5-2.1-8.5-1.3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 6.8v12" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="15" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5h6a2 2 0 012 2V20a2.5 2.5 0 00-2.5-2.5H4zM20 5.5h-6a2 2 0 00-2 2V20a2.5 2.5 0 012.5-2.5H20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.2 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.2-3.6-8.5S9.6 5.9 12 3.5z" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3.2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6zM18.5 16l.7 2.3 2.3.7-2.3.7-.7 2.3-.7-2.3-2.3-.7 2.3-.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5h3v14H8zM14 5h3v14h-3z" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 8a7.5 7.5 0 10.2 7.5M19 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16M9.5 6.4A9.8 9.8 0 0112 6c5 0 8.5 4.2 9.5 6-.4.8-1.3 2-2.6 3.2M6.2 8.3C4.7 9.6 3.7 11 3 12c1 1.8 4.5 6 9 6 1.4 0 2.7-.3 3.9-.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10 10a3 3 0 004 4" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 10l2.5 2L7 14M12 14h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5l7 2.7v5.1c0 4.4-2.9 7.7-7 9.2-4.1-1.5-7-4.8-7-9.2V6.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <canvas id="light-canvas" aria-hidden="true"></canvas>
  <div id="ambient-wash" aria-hidden="true"></div>
  <div id="spotlight" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar glass" id="topbar">
      <button id="back-btn" class="back-btn" type="button" hidden title="返回封面">
        <svg class="icon"><use href="#i-back"></use></svg>
        <span>封面</span>
      </button>
      <div class="brand" id="brand">
        <span class="brand-mark" id="brand-mark"><span>L</span></span>
        <span class="brand-text">LUMEN <em>ENGLISH</em></span>
      </div>
      <div class="topbar-title" id="topbar-title"></div>
      <div class="topbar-right">
        <span class="topbar-meta" id="topbar-meta">沉浸光感</span>
      </div>
    </header>

    <main id="stage">
      <section id="cover-view" class="cover view">
        <div class="cover-bg" id="cover-bg"></div>
        <div class="cover-shade"></div>
        <div class="cover-inner">
          <div class="cover-copy">
            <p class="cover-kicker">IMMERSIVE ENGLISH · 光感学习台</p>
            <h1>把英语，<br>放进一束光里。</h1>
            <p class="cover-sub">论文翻译、四六级、阅读训练与设置，都在这张安静的书桌上。</p>
          </div>
          <div class="cover-tiles" aria-label="功能入口">
            <button class="cover-tile" type="button" data-module="translation">
              <span class="tile-glow"></span>
              <span class="tile-icon"><svg class="icon"><use href="#i-translate"></use></svg></span>
              <span class="tile-label">论文翻译</span>
              <span class="tile-note">术语锁定 · 双栏回译 · 大纲</span>
            </button>
            <button class="cover-tile" type="button" data-module="cet">
              <span class="tile-glow"></span>
              <span class="tile-icon"><svg class="icon"><use href="#i-exam"></use></svg></span>
              <span class="tile-label">四六级</span>
              <span class="tile-note">对点练习 · 词汇 · 批改</span>
            </button>
            <button class="cover-tile" type="button" data-module="reading">
              <span class="tile-glow"></span>
              <span class="tile-icon"><svg class="icon"><use href="#i-reading"></use></svg></span>
              <span class="tile-label">阅读训练</span>
              <span class="tile-note">三个方向 · 内置浏览器</span>
            </button>
            <button class="cover-tile" type="button" data-module="settings">
              <span class="tile-glow"></span>
              <span class="tile-icon"><svg class="icon"><use href="#i-settings"></use></svg></span>
              <span class="tile-label">设置</span>
              <span class="tile-note">外观 · 接口 · 数据 · 更新</span>
            </button>
          </div>
          <div class="cover-foot">
            <span>本地 SQLite 内容库</span>
            <span class="foot-dot"></span>
            <span>AI 接口按需连接</span>
            <span class="foot-dot"></span>
            <span id="cover-version">Lumen English</span>
          </div>
        </div>
      </section>

      <section id="module-view" class="module-view" hidden>
        <div class="module-head" id="module-head">
          <div class="module-head-copy">
            <p class="module-kicker" id="module-kicker"></p>
            <h2 id="module-heading"></h2>
          </div>
          <div class="direction-tabs" id="direction-tabs" hidden>
            <button type="button" data-direction="exam">考试</button>
            <button type="button" data-direction="daily">日常</button>
            <button type="button" data-direction="research">科研</button>
          </div>
        </div>
        <nav class="secondary-nav glass" id="secondary-nav" aria-label="模块子页面"></nav>
        <div class="module-surface" id="module-surface">
          <div class="module-content" id="module-content"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="word-popover" class="word-popover" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
