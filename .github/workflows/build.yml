name: Build and release Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for Electron ABI
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Note static renderer build
        run: echo "Renderer is plain HTML/CSS/JS; there is no frontend build step."

      - name: Build and publish NSIS installer
        run: npx electron-builder --win --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-english-windows
          if-no-files-found: warn
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
