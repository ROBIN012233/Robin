name: Build and release Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare static renderer libraries
        run: node scripts/prepare-vendor.js

      - name: Ensure better-sqlite3 ABI
        # better-sqlite3 13 ships N-API prebuilds. The source rebuild is a best-effort
        # ABI sanity check; the runner's Visual Studio 18 is not supported by the
        # legacy node-gyp used by this addon, so do not block the release on it.
        run: npx electron-rebuild -f -w better-sqlite3
        continue-on-error: true

      - name: Note static renderer build
        run: echo "Renderer is plain HTML/CSS/JS; there is no frontend build step."

      - name: Build and publish NSIS installer
        run: npx electron-builder --win --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-english-windows
          if-no-files-found: warn
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
